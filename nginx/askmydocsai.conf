# ── Rate limiting zones (per client IP) ──
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;   # normal API traffic
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=5r/m;    # login, signup, OTP, password reset
limit_req_zone  $binary_remote_addr zone=api_query:10m   rate=30r/m;   # /query (Jina + Groq cost)
limit_req_zone  $binary_remote_addr zone=api_upload:10m  rate=20r/m;   # presigned upload URLs
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name askmydocsai.dpdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name askmydocsai.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/askmydocsai.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askmydocsai.dpdns.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn conn_per_ip 30;

    # JSON body for rate-limited requests so the frontend can handle it
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Too many requests. Please slow down and try again shortly."}';
    }

    # Frontend (React/Vite build output)
    root /var/www/askmydocsai;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # API Gateway upstream (replace API_ID and region)
    resolver 169.254.169.253 valid=30s ipv6=off;
    set $api_host     API_ID.execute-api.ap-south-1.amazonaws.com;
    set $api_upstream https://$api_host;

    # Auth endpoints that can be brute-forced or trigger emails: 5 per minute, burst of 5
    location ~ ^/api/v1/auth/(login|signup|verify-signup|forgot-password|reset-password)$ {
        limit_req zone=api_auth burst=5 nodelay;
        include snippets/api_proxy.conf;
    }

    # RAG query: 30 per minute, burst of 10
    location = /api/v1/query {
        limit_req zone=api_query burst=10 nodelay;
        include snippets/api_proxy.conf;
    }

    # Upload URL generation: 20 per minute, burst of 10
    location = /api/v1/upload/presigned-url {
        limit_req zone=api_upload burst=10 nodelay;
        include snippets/api_proxy.conf;
    }

    # Everything else (refresh, logout, me, admin, super-admin)
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        include snippets/api_proxy.conf;
    }
}